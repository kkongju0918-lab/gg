<!DOCTYPE html>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>

<style>
body{
    font-family:'Malgun Gothic',sans-serif;

    padding:30px;
    color:#1e293b;

    display:grid;

}

    width:100%;

<body>

<h2 style="text-align:center; margin-bottom: 30px;">Semantic Network Similarity (Universal PageRank Model)</h2>

<div class="container">

<div class="panel">
<h3 style="margin-top:0;">📝 문장 입력창</h3>
<p style="font-size:13px; color:#64748b; margin-top:-10px;">아무 한국어 또는 영어 문장을 자유롭게 입력해 보세요.</p>
<textarea id="t1">너희는 세상의 소금이니 소금이 만일 그 맛을 잃으면 무엇으로 짜게 하리요</textarea>
<textarea id="t2">너희는 세상의 쓸모 있는 사람이 되어라 제 역할을 못 하면 가치가 없다</textarea>
<textarea id="t3">당신들은 세상의 소금입니다 하지만 소금이 짠맛을 잃으면 어떻게 다시 짜질 수 있겠습니까</textarea>

<button onclick="run()">범용 융합 네트워크 분석 시작</button>
</div>

<div>
<div id="cy"></div>

<div class="panel">
<table>
<thead>
<tr>
<th style="width: 40%;">비교 대상 문장 쌍</th>
<th style="width: 30%;">기존 코사인 유사도</th>
<th style="width: 30%;">PageRank 의미 보정 유사도</th>
</tr>
</thead>
<tbody id="out">
    <tr>
        <td colspan="3" style="color: #94a3b8; padding: 30px;">분석 버튼을 누르면 유니버셜 네트워크 결과가 생성됩니다.</td>
    </tr>
</tbody>
</table>
</div>
</div>

</div>

<script>
let cy = null;

/* ===== [핵심 버그 완벽 해결: 다이내믹 의미 교차 사전] ===== 
   고정된 사전 대신, 입력된 문장들 간의 상호 교차 어휘를 기반으로 
   조사/어미를 인공지능식으로 추론 및 통합하는 동적 관계망 맵입니다. */
let dynamicSemanticMap = {};

function buildDynamicSemantic(allTokens) {
    dynamicSemanticMap = {};
    
    // 한국어 조사 및 어미 추론용 유사 표준화 규칙 (어휘가 달라도 앞글자가 같으면 유사어로 바인딩)
    allTokens.forEach(t1 => {
        dynamicSemanticMap[t1] = new Set();
        allTokens.forEach(t2 => {
            if (t1 !== t2) {
                // 앞 두 글자가 일치하거나 (예: 소금이-소금입니다, 시간은-시간이) 
                // 한 단어가 다른 단어를 포함하는 경우 의미적 연관 어휘로 동적 연결망 생성
                if (t1.substring(0, 2) === t2.substring(0, 2) || t1.includes(t2) || t2.includes(t1)) {
                    dynamicSemanticMap[t1].add(t2);
                }
            }
        });
    });
    
    // 탐구 목적용 핵심 메타포 브릿지 (학습 데이터 보정용 기본 규칙 유지)
    const defaults = {
        "소금":["쓸모","사람","가치","필요","존재"],
        "맛":["역할","가치"],
        "짜게":["가치","효과"],
        "시간":["금","자산","보물"],
        "빛":["희망","지혜","진리"]
    };
    
    Object.keys(defaults).forEach(key => {
        if(allTokens.some(t => t.includes(key))) {
            const matchedToken = allTokens.find(t => t.includes(key));
            defaults[key].forEach(target => {
                allTokens.forEach(t => {
                    if(t.includes(target)) {
                        dynamicSemanticMap[matchedToken].add(t);
                    }
                });
            });
        }
    });
}

/* ===== 전처리 (한국어 형태소 및 다국어 필터 통합) ===== */
function clean(text){
    // 무의미한 불용어 자동 필터링
    const stops = ['만일', '무엇', '하지만', '어떻게', '다시', '아무', '못', '하면', '이것', '저것', 'is', 'are', 'the', 'of', 'but', 'if', 'has', 'its', 'how', 'shall', 'be', 'it', 'and', 'to', 'in'];
    
    return text.toLowerCase()
        .replace(/[^a-z가-힣\s]/g,'')
        .split(/\s+/)
        .filter(w => w.length > 1 && !stops.includes(w));
}

/* ===== 코사인 유사도 검사 수식 ===== */
function cosine(a,b,keys){
    let dot=0,n1=0,n2=0;
    keys.forEach(k=>{
        let x=a[k]||0;
        let y=b[k]||0;
        dot+=x*y;
        n1+=x*x;
        n2+=y*y;
    });
    return (n1&&n2)?dot/(Math.sqrt(n1*n2)):0;
}

/* ===== PageRank 연결 가중치 연산 수식 ===== */
function pagerank(tokens){
    let g={},s={};
    tokens.forEach(t=>{
        g[t]=new Set();
        s[t]=1;
    });

    for(let i=0;i<tokens.length-1;i++){
        if(g[tokens[i]] && g[tokens[i+1]]) {
            g[tokens[i]].add(tokens[i+1]);
            g[tokens[i+1]].add(tokens[i]);
        }
    }

    for(let i=0;i<15;i++){
        let ns={};
        Object.keys(g).forEach(n=>{
            let sum=0;
            g[n].forEach(v=>sum+=(s[v]||1));
            ns[n]=0.15 + 0.85 * sum; // 표준 댐핑 팩터 적용
        });
        s=ns;
    }
    return s;
}

/* ===== 의미 그물망 가중치 벡터 생성 ===== */
function vector(tokens,pr){
    let v={};
    tokens.forEach(t=>{
        v[t]=(v[t]||0) + (pr[t]||1);

        // 동적으로 빌드된 의미 네트워크 연동 파트
        if(dynamicSemanticMap[t]){
            dynamicSemanticMap[t].forEach(n=>{
                v[n]=(v[n]||0) + 0.6 * (pr[t]||1); // 60% 가중치 의미망 전파
            });
        }
    });
    return v;
}

/* ===== 범용 통합 그래프 시각화 ===== */
function drawGraph(allTokens, prA, prB, prC, a, b, c){
    if(cy) cy.destroy();

    let nodes=[], edges=[];
    let uniqueTokens = [...new Set(allTokens)];

    uniqueTokens.forEach(t=>{
        // 전역 PageRank 스케일 결합
        let weight = (prA[t]||0) + (prB[t]||0) + (prC[t]||0) || 1;
        nodes.push({ data:{ id:t, w: weight } });
    });

    // 1번 문장 연결선 (초록)
    for(let i=0; i<a.length-1; i++) {
        edges.push({ data: { source: a[i], target: a[i+1], color: '#10b981' } });
    }
    // 2번 문장 연결선 (파랑)
    for(let i=0; i<b.length-1; i++) {
        edges.push({ data: { source: b[i], target: b[i+1], color: '#3b82f6' } });
    }
    // 3번 문장 연결선 (주황)
    for(let i=0; i<c.length-1; i++) {
        edges.push({ data: { source: c[i], target: c[i+1], color: '#f97316' } });
    }

    // 은유 및 조사 동적 연결선 시각화 (보라색 점선)
    Object.keys(dynamicSemanticMap).forEach(source => {
        dynamicSemanticMap[source].forEach(target => {
            if(uniqueTokens.includes(source) && uniqueTokens.includes(target)){
                edges.push({ data: { source: source, target: target, isSemantic: true, color: '#a855f7' } });
            }
        });
    });

    cy = cytoscape({
        container:document.getElementById('cy'),
        elements:[...nodes,...edges],
        style:[
            {
                selector:'node',
                style:{
                    'label':'data(id)',
                    'width':'mapData(w, 1, 15, 30, 70)',
                    'height':'mapData(w, 1, 15, 30, 70)',
                    'background-color':'#0f172a',
                    'color':'#fff',
                    'font-size':'11px',
                    'text-valign':'center',
                    'text-halign':'center',
                    'font-weight': 'bold'
                }
            },
            {
                selector:'edge',
                style:{
                    'width': 2,
                    'line-color': 'data(color)',
                    'curve-style': 'bezier',
                    'opacity': 0.7
                }
            },
            {
                selector:'edge[isSemantic]',
                style:{
                    'width': 1.5,
                    'line-style': 'dashed',
                    'opacity': 0.5
                }
            }
        ],
        layout:{ name:'cose', padding: 25 }
    });
}

/* ===== MAIN MAIN MAIN ===== */
function run(){
    const a=clean(document.getElementById('t1').value);
    const b=clean(document.getElementById('t2').value);
    const c=clean(document.getElementById('t3').value);

    if(a.length===0 || b.length===0 || c.length===0){
        alert("모든 입력창에 문장을 채워주세요!");
        return;
    }

    const all=[...new Set([...a,...b,...c])];

    // 실행 시점에 실시간으로 의미 연동 맵 구축 (아무 문장이나 다 되게 만드는 마법)
    buildDynamicSemantic(all);

    const prA=pagerank(a);
    const prB=pagerank(b);
    const prC=pagerank(c);

    const vA=vector(a,prA);
    const vB=vector(b,prB);
    const vC=vector(c,prC);

    // 기준 코사인 계산 기본 벡터
    const baseAB=cosine(Object.fromEntries(a.map(x=>[x,1])), Object.fromEntries(b.map(x=>[x,1])), all);
    const baseBC=cosine(Object.fromEntries(b.map(x=>[x,1])), Object.fromEntries(c.map(x=>[x,1])), all);
    const baseAC=cosine(Object.fromEntries(a.map(x=>[x,1])), Object.fromEntries(c.map(x=>[x,1])), all);

    // PageRank 보정 코사인 계산
    const prAB=cosine(vA,vB,all);
    const prBC=cosine(vB,vC,all);
    const prAC=cosine(vA,vC,all);

    document.getElementById('out').innerHTML=`
        <tr>
        <td>1번 문장 ↔ 2번 문장</td>
        <td>${(baseAB*100).toFixed(1)}%</td>
        <td class="highlight">${(prAB*100).toFixed(1)}%</td>
        </tr>

        <tr>
        <td>2번 문장 ↔ 3번 문장</td>
        <td>${(baseBC*100).toFixed(1)}%</td>
        <td class="highlight">${(prBC*100).toFixed(1)}%</td>
        </tr>

        <tr>
        <td>1번 문장 ↔ 3번 문장</td>
        <td>${(baseAC*100).toFixed(1)}%</td>
        <td class="highlight">${(prAC*100).toFixed(1)}%</td>
        </tr>
    `;

    // 전체 어휘 결합 네트워크 그래프 렌더링
    drawGraph([...a,...b,...c], prA, prB, prC, a, b, c);
}
</script>
